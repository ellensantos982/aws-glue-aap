---
# Variáveis do restart_glue_job.yml. Tudo o que depende do ambiente fica neste arquivo:
# para ajustar, basta alterar aqui e dar push (o AAP atualiza o projeto ao lançar o job).

# ---------- Evento ----------
# O evento é o incidente da ServiceNow: o identificador do incidente fica na raiz do evento, e os
# dados do job ficam num bloco dentro dele. Se algum dado vier com outro nome, troque só o lado direito.
evento_bloco_do_job: u_additional_info   # vazio = os dados do job também ficam na raiz do evento
evento_campos:
  incidente: sys_id        # na raiz do evento
  conta: account           # daqui para baixo, dentro do bloco
  regiao: region
  job: jobName
  execucao: jobRunId
  estado: jobState
# O que o campo do incidente traz: sys_id (32 caracteres hexadecimais) ou numero (ex.: INC0012345)
evento_incidente_tipo: sys_id

# Estados que a automação trata. Evento com outro estado termina sem tocar no incidente.
# A execução também é conferida no Glue: só é reiniciada se estiver mesmo num destes estados.
glue_estados_travado: [TIMEOUT]

# ---------- AWS ----------
# A conta e a região vêm do evento. O Ansible assume este papel na conta do job: ele precisa
# existir com o mesmo nome em cada conta e confiar na identidade que o AAP usa na AWS.
aws_papel_automacao: AJUSTAR-nome-do-papel
aws_external_id: ""            # só se o papel exigir ExternalId
aws_regioes_permitidas: []     # vazio = qualquer região; ou, por exemplo, [sa-east-1, us-east-1]

# Quais jobs podem ser reiniciados:
#   tag   -> só jobs com a tag job_tag_chave=job_tag_valor
#   lista -> só os jobs de jobs_permitidos
#   todos -> qualquer job que o papel alcance (a única barreira passa a ser a permissão do papel)
job_elegibilidade: tag
job_tag_chave: auto-remediacao
job_tag_valor: sim
jobs_permitidos: []

# Evita loop (restart que trava de novo gera outro incidente): no máximo N restarts por job na janela
max_restarts: 3
janela_restarts_horas: 1
# Quanto esperar o restart terminar antes de devolver o incidente com a execução ainda em andamento
espera_restart_segundos: 900

# ---------- ServiceNow ----------
# Endereço da instância e token de autenticação Basic (usuário:senha em base64), no mesmo esquema
# do role de fechamento: variável instance_url / sn_access_token, ou as variáveis de ambiente abaixo.
sn_url: "{{ instance_url | default(lookup('ansible.builtin.env', 'SN_HOST'), true) | regex_replace('/$', '') }}"
sn_token_basic: "{{ sn_access_token | default(lookup('ansible.builtin.env', 'SN_ACCESS_TOKEN'), true) | trim }}"
# AJUSTAR para false só se o execution environment não confiar no certificado da instância
sn_validar_certificado: true

# Usuário da automação (sys_id), gravado em assigned_to ao assumir o incidente. Vazio = não grava;
# no fechamento pelo role, vazio usa o usuário padrão do próprio role.
sn_usuario_automacao: ""

# Fechamento: pelo role do repositório (padrão do ambiente) ou, com o valor vazio, direto pela API.
sn_role_de_fechamento: servicenow/encerra_incidente
# Exigido pelo role de fechamento: o identificador da ação executada, cadastrado na ServiceNow
sn_u_action_to_be_taken: AJUSTAR-acao-executada
sn_status_automacao: SUCESSO

# Códigos de resolução: precisam existir na instância
sn_close_code: Solved (Permanently)
sn_close_code_duplicado: Duplicate      # AJUSTAR se a instância usar outro código para duplicado

# Só no fechamento direto pela API: campos gravados além de estado, código e notas
sn_campos_ao_resolver:
  u_automation_status: "{{ sn_status_automacao }}"
  # Horário de normalização do impacto: a hora em que a automação resolveu
  u_impact_end: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }}"
