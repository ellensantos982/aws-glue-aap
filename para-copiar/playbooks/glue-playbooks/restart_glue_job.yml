---
# Acionado pelo EDA quando chega o evento de um incidente de job Glue.
# Lê do evento o incidente e os dados do job (os nomes dos campos ficam em
# vars/restart_glue_job.yml), assume o papel de automação na conta do job, confere que a
# execução travou de fato, reinicia o job e resolve o incidente com o resultado. Não para nem
# reinicia nada além dessa execução, e qualquer falha no caminho fica anotada no incidente.
- name: Reiniciar job Glue travado
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/restart_glue_job.yml
  vars:
    # O rulebook passa o evento inteiro na variável "evento". Para lançar o job à mão, informe
    # "evento" com os mesmos campos. Só os campos citados em evento_campos são lidos.
    ev: "{{ evento | default({}) }}"
    # Os dados do job podem vir num bloco dentro do evento (evento_bloco_do_job), como objeto ou como texto JSON
    bloco: "{{ ev[evento_bloco_do_job] | default({}, true) if evento_bloco_do_job | default('', true) | length > 0 else ev }}"
    dados: "{{ (bloco | from_json) if bloco is string else bloco }}"
    incidente_ref: "{{ ev[evento_campos.incidente] | default('', true) | string | trim }}"
    conta_id: "{{ dados[evento_campos.conta] | default('', true) | string | trim }}"
    regiao: "{{ dados[evento_campos.regiao] | default('', true) | string | trim }}"
    job_name: "{{ dados[evento_campos.job] | default('', true) | string }}"
    run_travado: "{{ dados[evento_campos.execucao] | default('', true) | string | trim }}"
    estado_evento: "{{ dados[evento_campos.estado] | default('', true) | string | trim }}"
    # O campo do incidente traz o sys_id ou o número (INC...), conforme evento_incidente_tipo
    por_sys_id: "{{ evento_incidente_tipo | default('sys_id') == 'sys_id' }}"
    fechar_pelo_role: "{{ sn_role_de_fechamento | default('', true) | length > 0 }}"
    responsavel: "{{ {'assigned_to': sn_usuario_automacao} if sn_usuario_automacao | default('', true) | length > 0 else {} }}"

  module_defaults:
    # Todas as chamadas ao Glue usam a região do job e a credencial temporária do papel assumido.
    # O default('') é para o ansible-core 2.16, que avalia isto já nas tarefas anteriores ao
    # assume role; o Glue só é chamado depois dele.
    glue_job_run:
      region: "{{ regiao }}"
      access_key: "{{ sessao.sts_creds.access_key | default('') }}"
      secret_key: "{{ sessao.sts_creds.secret_key | default('') }}"
      session_token: "{{ sessao.sts_creds.session_token | default('') }}"
      profile: ""     # anula um AWS_PROFILE do ambiente, que conflita com a credencial temporária
    # As tarefas deste playbook que falam com a ServiceNow atualizam o incidente do evento:
    # cada uma só informa os campos (body). A consulta inicial troca o método e o endereço.
    ansible.builtin.uri:
      url: "{{ sn_endereco | default('') }}/api/now/table/incident/{{ incidente_sys_id | default('') }}"
      method: PATCH
      headers:
        Authorization: "Basic {{ sn_token | default('') }}"
        Accept: application/json
      body_format: json
      validate_certs: "{{ sn_validar_certificado | default(true) }}"
      status_code: 200

  tasks:
    # O Event Stream pode receber eventos de qualquer estado: os que a automação não trata
    # terminam aqui, sem tocar no incidente. Sem o campo de estado, quem decide é a conferência
    # da execução no Glue, mais abaixo.
    - name: Ignorar evento de estado que a automação não trata
      when: estado_evento | length > 0 and estado_evento not in glue_estados_travado
      block:
        - name: Informar o motivo
          ansible.builtin.debug:
            msg: "Evento ignorado: estado {{ estado_evento }} (a automação trata {{ glue_estados_travado | join(', ') }})."

        - name: Encerrar sem agir
          ansible.builtin.meta: end_play

    # A referência vai para a ServiceNow e para o nome da sessão do papel: fora do padrão, nada é feito.
    - name: Conferir a referência do incidente
      ansible.builtin.assert:
        that:
          - incidente_ref is match('^[0-9a-f]{32}$' if por_sys_id else '^[A-Z]{2,10}[0-9]{4,}$')
        fail_msg: >-
          O campo "{{ evento_campos.incidente }}" do evento não traz
          {{ 'um sys_id' if por_sys_id else 'um número de incidente' }} válido: nada foi feito.
        quiet: true

    # Endereço e token são fixados uma vez, para valerem iguais em todas as chamadas (inclusive
    # dentro do role de fechamento).
    - name: Fixar o endereço e o token da ServiceNow
      ansible.builtin.set_fact:
        sn_endereco: "{{ sn_url }}"
        sn_token: "{{ sn_token_basic }}"
      no_log: true

    - name: Conferir o endereço e o token da ServiceNow
      ansible.builtin.assert:
        that:
          - sn_endereco is match('https://')
          - sn_token | length > 0
        fail_msg: "Endereço (https://...) ou token da ServiceNow ausente nas variáveis ou na credencial: nada foi feito."
        quiet: true

    - name: Localizar o incidente
      ansible.builtin.uri:
        url: >-
          {{ sn_endereco }}/api/now/table/incident?sysparm_query={{ 'sys_id' if por_sys_id else 'number' }}={{
          incidente_ref }}&sysparm_fields=sys_id,number&sysparm_limit=1
        method: GET
      register: consulta
      failed_when: consulta.status | default(0) != 200 or consulta.json.result | default([]) | length != 1

    - name: Guardar o incidente
      ansible.builtin.set_fact:
        incidente_sys_id: "{{ consulta.json.result[0].sys_id }}"
        incidente_numero: "{{ consulta.json.result[0].number }}"

    - name: Conferir os dados do evento
      ansible.builtin.set_fact:
        motivo_recusa: "{{ verificacoes | selectattr('falhou') | map(attribute='motivo') | first | default('') }}"
      vars:
        verificacoes:
          - falhou: "{{ conta_id is not match('^[0-9]{12}$') }}"
            motivo: "o campo {{ evento_campos.conta }} do evento não traz uma conta AWS válida"
          - falhou: "{{ regiao is not match('^[a-z]{2}(-[a-z]+)+-[0-9]$') }}"
            motivo: "o campo {{ evento_campos.regiao }} do evento não traz uma região válida"
          - falhou: "{{ job_name | trim | length == 0 or job_name is search('[{}|]') }}"
            motivo: "o campo {{ evento_campos.job }} do evento não traz um nome de job válido"
          - falhou: "{{ run_travado is not match('^jr_[A-Za-z0-9_]+$') }}"
            motivo: "o campo {{ evento_campos.execucao }} do evento não traz um ID de execução válido"
          - falhou: "{{ aws_regioes_permitidas | default([], true) | length > 0 and regiao not in aws_regioes_permitidas }}"
            motivo: "a região {{ regiao }} não está em aws_regioes_permitidas"
          # Variável sem preencher ou com erro de digitação recusa, em vez de liberar todos os jobs
          - falhou: "{{ aws_papel_automacao | default('', true) | length == 0 or aws_papel_automacao is search('AJUSTAR') }}"
            motivo: "o papel de automação (aws_papel_automacao) não está preenchido nas variáveis"
          - falhou: "{{ job_elegibilidade | default('') not in ['tag', 'lista', 'todos'] }}"
            motivo: "job_elegibilidade precisa ser tag, lista ou todos"
          - falhou: >-
              {{ job_elegibilidade | default('') == 'tag' and
                 (job_tag_chave | default('', true) | string | length == 0 or job_tag_valor | default('', true) | string | length == 0) }}
            motivo: "a elegibilidade é por tag, mas job_tag_chave ou job_tag_valor está vazio"
          - falhou: "{{ job_elegibilidade | default('') == 'lista' and job_name not in jobs_permitidos | default([], true) }}"
            motivo: "o job {{ job_name }} não está em jobs_permitidos"
          # Sem a ação preenchida o role de fechamento não fecha: melhor recusar antes de reiniciar o job
          - falhou: >-
              {{ fechar_pelo_role and
                 (sn_u_action_to_be_taken | default('', true) | length == 0 or sn_u_action_to_be_taken is search('AJUSTAR')) }}
            motivo: "a ação executada (sn_u_action_to_be_taken) não está preenchida nas variáveis"

    - name: Tratar o incidente
      block:
        - name: Assumir o papel de automação na conta do job
          amazon.aws.sts_assume_role:
            role_arn: "arn:aws:iam::{{ conta_id }}:role/{{ aws_papel_automacao }}"
            role_session_name: "aap-{{ incidente_numero }}"
            external_id: "{{ aws_external_id | default(omit, true) }}"
            duration_seconds: 3600
            region: "{{ regiao }}"
          register: sessao
          failed_when: false
          no_log: true     # o resultado traz a credencial temporária; sem isto ela ficaria no log do job
          when: motivo_recusa | length == 0

        # Ex.: conta em que o papel ainda não foi criado, ou que não confia na identidade do AAP
        - name: Conferir se o papel foi assumido
          ansible.builtin.set_fact:
            motivo_recusa: >-
              não foi possível assumir o papel {{ aws_papel_automacao }} na conta {{ conta_id }}
              ({{ sessao.error.code | default(sessao.msg | default('erro desconhecido')) }})
          when: sessao is not skipped and sessao.sts_creds is not defined

        - name: Ler as tags do job
          glue_job_run:
            action: tags
            job_name: "{{ job_name }}"
          register: tags_job
          when: motivo_recusa | length == 0 and job_elegibilidade == 'tag'

        - name: Conferir a tag de auto-remediação
          ansible.builtin.set_fact:
            motivo_recusa: >-
              {{ 'o job ' ~ job_name ~ ' não existe na conta ' ~ conta_id ~ ', região ' ~ regiao if not tags_job.encontrado
                 else 'o job ' ~ job_name ~ ' não tem a tag ' ~ job_tag_chave ~ '=' ~ job_tag_valor }}
          when:
            - tags_job is not skipped
            - not tags_job.encontrado or tags_job.tags[job_tag_chave] | default('') != job_tag_valor

        # O incidente só vale se a execução que ele cita existir e tiver travado (glue_estados_travado).
        # Um evento com dados inventados ou de uma execução saudável não mexe no Glue.
        - name: Ler a execução que travou
          glue_job_run:
            action: info
            job_name: "{{ job_name }}"
            run_id: "{{ run_travado }}"
          register: travada
          failed_when: false
          when: motivo_recusa | length == 0

        - name: Conferir se a execução do incidente travou de fato
          ansible.builtin.set_fact:
            motivo_recusa: >-
              {{ 'a execução ' ~ run_travado ~ ' não foi encontrada no job ' ~ job_name ~ ' (' ~ travada.msg | default('sem detalhe') ~ ')'
                 if travada.job_run is not defined
                 else 'a execução ' ~ travada.job_run.Id ~ ' está em ' ~ travada.job_run.JobRunState ~ ', e não em ' ~ glue_estados_travado | join(' ou ') }}
          when:
            - travada is not skipped
            - travada.job_run is not defined or travada.job_run.JobRunState not in glue_estados_travado

        # Incidente repetido para a mesma execução travada (ex.: evento reenviado, ou alguém abriu
        # outro chamado): se o job já foi reiniciado depois dela, não reinicia de novo.
        - name: Ver se o job já foi reiniciado depois desse travamento
          glue_job_run:
            action: count
            job_name: "{{ job_name }}"
            argument_name: --origem
            argument_value: ansible-restart
            after_run_id: "{{ travada.job_run.Id }}"
          register: ja_reiniciado
          when: motivo_recusa | length == 0

        - name: Encerrar como duplicado
          when: ja_reiniciado.count | default(0) | int > 0
          vars:
            nota_duplicado: >-
              A execução travada {{ travada.job_run.Id }} já foi tratada: o job foi reiniciado pelo Ansible
              ({{ ja_reiniciado.execucoes | map(attribute='id') | join(', ') }}). Nada a fazer.
          block:
            - name: Resolver o incidente como duplicado
              ansible.builtin.uri:
                body: >-
                  {{ sn_campos_ao_resolver | default({}) | combine(responsavel)
                     | combine({'resolved_by': sn_usuario_automacao} if responsavel else {})
                     | combine({'state': '6', 'close_code': sn_close_code_duplicado, 'close_notes': nota_duplicado}) }}
              when: not fechar_pelo_role

            - name: Resolver o incidente como duplicado pelo role de fechamento
              ansible.builtin.include_role:
                name: "{{ sn_role_de_fechamento }}"
              vars:
                idIncidente: "{{ incidente_sys_id }}"                     # noqa: var-naming[pattern]
                instance_url: "{{ sn_endereco }}"
                sn_access_token: "{{ sn_token }}"
                u_action_to_be_taken: "{{ sn_u_action_to_be_taken }}"
                assigned_to: "{{ sn_usuario_automacao | default(incident_assigned_to, true) }}"
                automation_status: "{{ sn_status_automacao }}"
                u_additional_info: "{{ dados }}"
                close_code: "{{ sn_close_code_duplicado }}"
                close_notes: "{{ nota_duplicado }}"
                work_notes: "{{ nota_duplicado }}"
              when: fechar_pelo_role

            - name: Parar aqui
              ansible.builtin.meta: end_play

        # Uma execução iniciada depois da travada e ainda em andamento (agendamento, nova tentativa
        # do próprio Glue, alguém reiniciou à mão) não é a que travou: a automação não a interrompe
        # nem inicia outra por cima.
        - name: Procurar execuções mais novas em andamento
          glue_job_run:
            action: running
            job_name: "{{ job_name }}"
            after_run_id: "{{ travada.job_run.Id }}"
          register: mais_novas
          when: motivo_recusa | length == 0

        - name: Não reiniciar se o job já está rodando de novo
          ansible.builtin.set_fact:
            motivo_recusa: >-
              o job {{ job_name }} já tem execução mais nova em andamento
              ({{ mais_novas.runs | map(attribute='Id') | join(', ') }}); nada foi parado nem reiniciado
          when: mais_novas is not skipped and mais_novas.runs | length > 0

        - name: Não agir em conta, região, job ou execução fora das regras
          when: motivo_recusa | length > 0
          block:
            - name: Anotar no incidente
              ansible.builtin.uri:
                body:
                  work_notes: "A automação não atuou: {{ motivo_recusa }}. Encaminhar para a sustentação."

            - name: Interromper
              ansible.builtin.fail:
                msg: "Incidente {{ incidente_numero }}: {{ motivo_recusa }}"

        - name: Contar os restarts recentes do job
          glue_job_run:
            action: count
            job_name: "{{ job_name }}"
            argument_name: --origem
            argument_value: ansible-restart
            hours: "{{ janela_restarts_horas }}"
          register: restarts

        - name: Escalar se o job já foi reiniciado demais
          when: restarts.count | int >= max_restarts | int
          block:
            - name: Anotar no incidente
              ansible.builtin.uri:
                body:
                  work_notes: >-
                    O job já foi reiniciado {{ restarts.count }} vezes na última {{ janela_restarts_horas }} h (limite {{ max_restarts }}).
                    A automação não vai reiniciar de novo: encaminhar para a sustentação.

            - name: Interromper
              ansible.builtin.fail:
                msg: "Limite de restarts atingido para {{ job_name }}"

        - name: Assumir o incidente
          ansible.builtin.uri:
            body: >-
              {{ responsavel | combine({'state': '2', 'work_notes':
                 'Ansible recebeu o incidente pelo Event-Driven Ansible. Reiniciando o job ' ~ job_name ~ '.'}) }}

        # Com glue_estados_travado só em TIMEOUT a execução já terminou e nada é parado. Se um dia a
        # detecção incluir execução ainda ativa (sem progresso), só ela é parada, nunca as demais.
        - name: Parar a execução travada, se ainda estiver ativa
          glue_job_run:
            action: stop
            job_name: "{{ job_name }}"
            run_ids: ["{{ travada.job_run.Id }}"]
            timeout: 300
          register: parada
          when: travada.job_run.JobRunState in ['STARTING', 'RUNNING', 'STOPPING', 'WAITING']

        - name: Reiniciar o job com os mesmos argumentos
          glue_job_run:
            action: start
            job_name: "{{ job_name }}"
            arguments: "{{ travada.job_run.Arguments | default({}) | combine({'--origem': 'ansible-restart'}) }}"
          register: novo

        - name: Avisar no incidente que o job foi reiniciado
          ansible.builtin.uri:
            body:
              work_notes: >-
                {{ (parada is not skipped) | ternary('Execução travada ' ~ travada.job_run.Id ~ ' parada. ', '') }}Job reiniciado:
                nova execução {{ novo.run_id }}. Aguardando o término.

        # Se a espera acabar com o restart ainda rodando, o módulo devolve a execução como está
        # (tratada logo abaixo); só falha aqui quando não conseguiu consultar o Glue.
        - name: Aguardar o término
          glue_job_run:
            action: wait
            job_name: "{{ job_name }}"
            run_id: "{{ novo.run_id }}"
            timeout: "{{ espera_restart_segundos }}"
          register: final
          failed_when: final.job_run is not defined

        - name: Resolver o incidente
          when: final.job_run.JobRunState == 'SUCCEEDED'
          vars:
            nota_resolucao: >-
              Job {{ job_name }} reiniciado automaticamente pelo Ansible (Event-Driven Ansible).
              Execução {{ novo.run_id }} concluída com sucesso em {{ final.job_run.ExecutionTime | default('?') }} s.
          block:
            - name: Resolver o incidente pela API
              ansible.builtin.uri:
                body: >-
                  {{ sn_campos_ao_resolver | default({}) | combine(responsavel)
                     | combine({'resolved_by': sn_usuario_automacao} if responsavel else {})
                     | combine({'state': '6', 'close_code': sn_close_code, 'close_notes': nota_resolucao}) }}
              when: not fechar_pelo_role

            - name: Resolver o incidente pelo role de fechamento
              ansible.builtin.include_role:
                name: "{{ sn_role_de_fechamento }}"
              vars:
                idIncidente: "{{ incidente_sys_id }}"                     # noqa: var-naming[pattern]
                instance_url: "{{ sn_endereco }}"
                sn_access_token: "{{ sn_token }}"
                u_action_to_be_taken: "{{ sn_u_action_to_be_taken }}"
                assigned_to: "{{ sn_usuario_automacao | default(incident_assigned_to, true) }}"
                automation_status: "{{ sn_status_automacao }}"
                u_additional_info: "{{ dados }}"
                close_code: "{{ sn_close_code }}"
                close_notes: "{{ nota_resolucao }}"
                work_notes: "{{ nota_resolucao }}"
              when: fechar_pelo_role

        - name: Registrar que o restart não resolveu
          when: final.job_run.JobRunState != 'SUCCEEDED'
          vars:
            estado: "{{ final.job_run.JobRunState }}"
            terminou: "{{ final.job_run.JobRunState in ['FAILED', 'TIMEOUT', 'STOPPED', 'ERROR'] }}"
          block:
            - name: Anotar no incidente
              ansible.builtin.uri:
                body:
                  work_notes: >-
                    {{ 'O restart (execução ' ~ novo.run_id ~ ') terminou em ' ~ estado ~ ': ' ~ final.job_run.ErrorMessage | default('sem mensagem')
                       if terminou | bool
                       else 'O restart (execução ' ~ novo.run_id ~ ') ainda está em ' ~ estado ~ ' depois de ' ~ espera_restart_segundos ~ ' s de espera' }}.
                    Encaminhar para a sustentação.

            - name: Interromper
              ansible.builtin.fail:
                msg: "Restart de {{ job_name }} ({{ novo.run_id }}) em {{ estado }}"

      # Falha inesperada em qualquer etapa (API do Glue, ServiceNow, limite de execuções simultâneas...):
      # o incidente recebe a nota. As interrupções acima (fail) já deixaram a sua própria nota.
      rescue:
        - name: Anotar a falha no incidente
          ansible.builtin.uri:
            body:
              work_notes: >-
                A automação falhou na etapa "{{ ansible_failed_task.name }}":
                {{ ansible_failed_result.msg | default('sem mensagem') | string | truncate(600) }}.
                Confira o estado do job {{ job_name }} e encaminhe para a sustentação.
          when: ansible_failed_task.action not in ['fail', 'ansible.builtin.fail']

        - name: Encerrar com erro
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Falha na etapa ' ~ ansible_failed_task.name) }}"
