---
# Catálogo de contas: o Ansible só age em conta, região e job que passem pelas regras daqui,
# venha o que vier no evento. A chave é o ID da conta, como chega no campo account do evento
# (o rulebook monta com ele o correlation_id: <conta>|<região>|<job>|<execução>).
#
# A conta abaixo é um modelo: troque o ID e os valores pelos da conta de dev.
contas:
  "111122223333":
    nome: AJUSTAR-nome-da-conta
    # Papel que o Ansible assume na conta (sts:AssumeRole)
    papel_automacao: AJUSTAR-nome-do-papel
    # external_id: AJUSTAR   (só se o papel exigir ExternalId; sem ele, apague a linha)
    regioes: [sa-east-1]
    # tag: só jobs com a tag tag_chave=tag_valor | lista: só os jobs de jobs_permitidos
    elegibilidade: tag
    tag_chave: auto-remediacao
    tag_valor: sim
    # max_restarts: 2                (opcional; sem ele vale o de vars.yml)
    # espera_restart_segundos: 3600  (opcional; para jobs que demoram mais que o padrão de vars.yml)

  # Exemplo com lista de jobs em vez de tag:
  # "444455556666":
  #   nome: dados-dev
  #   papel_automacao: aap-auto-remediacao
  #   regioes: [sa-east-1, us-east-1]
  #   elegibilidade: lista
  #   jobs_permitidos: [carga-diaria, consolida-saldos]
  #   max_restarts: 2
