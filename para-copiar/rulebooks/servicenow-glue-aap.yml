---
# Rulebook activation ligada ao Event Stream que recebe os incidentes da ServiceNow.
# O rulebook só separa os incidentes de job Glue e entrega o evento inteiro ao job template, na
# variável "evento". Quais campos são lidos, quais estados são tratados e todas as outras regras
# ficam nas variáveis do playbook (playbooks/glue-playbooks/vars/restart_glue_job.yml): ajustar
# não exige mexer aqui nem recriar a activation.
# A fonte abaixo é substituída pelo Event Stream no mapeamento de fontes da activation.
- name: Incidente de job Glue -> EDA -> restart
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Incidente de job Glue
      # O incidente de job Glue é reconhecido pelo tipo do alerta, no bloco u_additional_info:
      # troque AJUSTAR-tipo-do-alerta pelo valor que os incidentes de job Glue trazem em alert_type.
      # Só o incidente novo (state 1) dispara: uma atualização do mesmo incidente não lança outro job.
      # Para restringir a um procedimento, acrescente o número do KB:
      #   and event.payload.u_additional_info.kb_number == "AJUSTAR-kb"
      condition: >-
        event.payload.u_additional_info.alert_type == "AJUSTAR-tipo-do-alerta"
        and event.payload.state == "1"
      action:
        run_job_template:
          organization: "AJUSTAR-organizacao"       # organização do job template no AAP
          name: "AJUSTAR-nome-do-job-template"      # job template que roda o restart_glue_job.yml
          job_args:
            extra_vars:
              evento: "{{ event.payload }}"
