---
# Coleções que o restart_glue_job.yml e o rulebook usam. Se o repositório de destino já tiver um
# collections/requirements.yml, acrescente só as linhas que faltarem; se o execution environment
# e o decision environment já trouxerem estas coleções, este arquivo não precisa ser copiado.
collections:
  - name: amazon.aws
    version: ">=9.0.0"
  - name: servicenow.itsm
    version: ">=2.8.0"
  - name: ansible.eda
    version: ">=2.0.0"
